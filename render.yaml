services:
  - type: web
    name: athena-spectral-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ternary_organizer_server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: HACKATHON_BUDGET
        value: "30"
      - key: PYTHON_VERSION
        value: "3.12.7"
